name: proximity
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  lottie: ^3.4.0
  supabase_flutter: ^2.15.3
  flutter_dotenv: ^6.0.1
  mailer: ^7.1.0
  google_sign_in: 6.2.1
  shared_preferences: ^2.5.5
  mapbox_maps_flutter: ^2.0.0
  geolocator: ^14.0.3
  http: ^1.6.0
  speech_to_text: ^7.0.0
  # Disk + memory caching for network images (Cloudinary-hosted train photos),
  # with placeholder support so we can show skeleton loading while fetching.
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Generates the app launcher icon from the Proximity logo.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "public/assets/logos/proximity_icon_square_raw.png"



# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Assets bundled with the app. Flutter does not recurse into
  # subdirectories, so each folder that contains files is listed here.
  assets:
    # Environment secrets loaded at runtime via flutter_dotenv.
    - .env.local
    - public/assets/audio/
    - public/assets/audio/calming alarms/
    - public/assets/audio/intense alarms/
    - public/assets/fonts/inter/
    - public/assets/fonts/poppins/
    - public/assets/icons/
    - public/assets/images/
    - public/assets/logos/
    - public/assets/splash/

  fonts:
    - family: Poppins
      fonts:
        - asset: public/assets/fonts/poppins/Poppins-Regular.ttf
        - asset: public/assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: public/assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: public/assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: public/assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: public/assets/fonts/poppins/Poppins-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: public/assets/fonts/inter/Inter_18pt-Thin.ttf
          weight: 100
        - asset: public/assets/fonts/inter/Inter_18pt-Light.ttf
          weight: 300
        - asset: public/assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: public/assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: public/assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700
